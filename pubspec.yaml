name: inventory_app
description: Offline inventory & sales app for small shops. Free, open source, no login.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  collection: ^1.19.1
  equatable: ^2.0.7
  fl_chart: ^0.70.2
  file_picker: ^8.1.7
  local_auth: ^2.3.0
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icons/
    - assets/svg/
