<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb" id="themeColor">
  <title>✍️ Feedbacks</title>

  <style>
    :root {
      color-scheme: light;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --green: #16a34a;
      --orange: #d97706;
      --radius: 12px;
      --shadow: 0 8px 24px #0f172a14;
      --focus-ring: #2563eb18;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --primary: #3b82f6;
      --primary-light: #1e3a5f;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
      --green: #4ade80;
      --orange: #fbbf24;
      --shadow: 0 8px 24px #00000040;
      --focus-ring: #60a5fa30;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s, color .2s;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
    }

    /* Header */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 8px 12px;
      margin-bottom: 12px;
      background: var(--primary);
      color: white;
      border-radius: 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 650;
    }

    .theme-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid #ffffff50;
      border-radius: 9px;
      background: #ffffff15;
      color: white;
    }

    .theme-btn:hover {
      background: #ffffff30;
    }

    .theme-btn svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Toolbar: search, expanding input, sort, spacer */

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      margin-bottom: 10px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      transition: background .15s, border-color .15s;
    }

    .icon-btn:hover,
    .icon-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /*
      Keep search and sort controls together.
      The input expands between the two buttons.
    */

    #searchBtn {
      order: 1;
    }

    .search-wrap {
      display: none;
      flex: 1 1 auto;
      min-width: 0;
      order: 2;
    }

    .search-wrap.open {
      display: block;
    }

    .search-wrap input {
      display: block;
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 0 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    .search-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .sort-container {
      position: relative;
      flex: 0 0 42px;
      width: 42px;
      order: 3;
    }

    .sort-menu {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: 190px;
      max-width: calc(100vw - 24px);
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      display: none;
    }

    .sort-menu.open {
      display: block;
      animation: menuAppear .15s ease-out;
    }

    .sort-menu-label {
      padding: 8px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .sort-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 42px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-size: 14px;
    }

    .sort-option:hover {
      background: var(--bg);
    }

    .sort-option.selected {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .sort-option .checkmark {
      visibility: hidden;
      font-size: 16px;
    }

    .sort-option.selected .checkmark {
      visibility: visible;
    }

    .toolbar-spacer {
      flex: 1 1 auto;
      min-width: 0;
      order: 4;
    }

    @keyframes menuAppear {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Feedback type filters */

    .type-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 14px;
    }

    .chip {
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
    }

    .chip:hover {
      border-color: var(--primary);
    }

    .chip.selected {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    /* Feedback cards */

    .feedback-list {
      display: grid;
      gap: 10px;
    }

    .feedback-card {
      min-width: 0;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px #0f172a05;
      transition: background-color .2s, border-color .2s;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .type-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 650;
      font-size: 14px;
    }

    .type-label.improvement {
      color: var(--green);
    }

    .type-label.problem {
      color: var(--orange);
    }

    .date {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      line-height: 1.5;
      flex-shrink: 0;
    }

    .message {
      margin: 0;
      font-size: 14px;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    /* Empty state */

    .empty-state {
      display: none;
      padding: 36px 16px;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .empty-state.visible {
      display: block;
    }

    .empty-state .empty-icon {
      margin-bottom: 8px;
      font-size: 28px;
    }

    .empty-state h2 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .empty-state p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* Responsive layout */

    @media (min-width: 600px) {
      .page {
        padding: 22px;
      }

      .header {
        min-height: 44px;
      }

      .header h1 {
        font-size: 19px;
      }

      .feedback-card {
        padding: 16px 18px;
      }

      .toolbar {
        gap: 10px;
      }
    }

    @media (max-width: 360px) {
      .toolbar {
        gap: 6px;
      }

      .icon-btn,
      .sort-container {
        flex-basis: 38px;
        width: 38px;
      }

      .icon-btn {
        height: 40px;
      }

      .sort-container .icon-btn {
        width: 38px;
      }

      .search-wrap input {
        height: 40px;
        padding: 0 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="header">
      <h1>✍️ Feedbacks</h1>

      <button
        class="theme-btn"
        id="themeBtn"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false"
        title="Switch to dark mode"
      >
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.9 13A8.5 8.5 0 0 1 11 3.1 8.5 8.5 0 1 0 20.9 13Z"></path>
        </svg>
      </button>
    </header>

    <!-- Search and sort toolbar -->

    <div class="toolbar" aria-label="Feedback controls">

      <button
        class="icon-btn"
        id="searchBtn"
        type="button"
        aria-label="Search feedback"
        aria-expanded="false"
        aria-controls="searchWrap"
        title="Search"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m16 16 4 4"></path>
        </svg>
      </button>

      <div class="search-wrap" id="searchWrap">
        <input
          id="searchInput"
          type="search"
          placeholder="Search feedback..."
          aria-label="Search feedback"
        >
      </div>

      <div class="sort-container">
        <button
          class="icon-btn"
          id="sortBtn"
          type="button"
          aria-label="Sort feedback"
          aria-expanded="false"
          aria-haspopup="true"
          aria-controls="sortMenu"
          title="Sort feedback"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16"></path>
            <path d="M7 12h10"></path>
            <path d="M10 17h4"></path>
          </svg>
        </button>

        <div
          class="sort-menu"
          id="sortMenu"
          role="menu"
          aria-label="Sort options"
        >
          <div class="sort-menu-label">Sort by date</div>

          <button
            class="sort-option selected"
            type="button"
            role="menuitemradio"
            aria-checked="true"
            data-sort="newest"
          >
            <span>Newest first</span>
            <span class="checkmark" aria-hidden="true">✓</span>
          </button>

          <button
            class="sort-option"
            type="button"
            role="menuitemradio"
            aria-checked="false"
            data-sort="oldest"
          >
            <span>Oldest first</span>
            <span class="checkmark" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>

      <div class="toolbar-spacer"></div>
    </div>

    <!-- Feedback type filters -->

    <div class="type-filters" id="typeFilters">
      <button
        class="chip selected"
        data-type="all"
        type="button"
        aria-pressed="true"
      >
        All
      </button>

      <button
        class="chip"
        data-type="improvement"
        type="button"
        aria-pressed="false"
      >
        🛠️ Improvements
      </button>

      <button
        class="chip"
        data-type="problem"
        type="button"
        aria-pressed="false"
      >
        ⚠️ Problems
      </button>
    </div>

    <section
      class="feedback-list"
      id="feedbackList"
      aria-label="Feedback list"
      aria-live="polite"
    ></section>

    <section class="empty-state" id="emptyState">
      <div class="empty-icon">🔎</div>
      <h2>No feedback found</h2>
      <p>Try another search or select a different feedback type.</p>
    </section>

  </main>

  <script>
    /*
      DEMO DATA:
      Replace this array with your existing API/database data
      when connecting the page to live feedback submissions.
    */

    const feedbacks = [
      {
        id: 1,
        type: "improvement",
        date: "2026-10-26T20:13:00",
        message: "make this better"
      },
      {
        id: 2,
        type: "problem",
        date: "2026-10-26T20:18:00",
        message: "sdf kfj aslkdjflk sadjflkasdj flkjsdalkf jdsalkjf lksadjflkdasj flkasdjflk sadjflk ajsdflkjasd lkfj sadlkfjlkasd jflñkasdj f"
      }
    ];

    const searchBtn = document.getElementById("searchBtn");
    const searchWrap = document.getElementById("searchWrap");
    const searchInput = document.getElementById("searchInput");

    const sortBtn = document.getElementById("sortBtn");
    const sortMenu = document.getElementById("sortMenu");
    const sortOptions = document.querySelectorAll(".sort-option");

    const themeBtn = document.getElementById("themeBtn");
    const themeIcon = document.getElementById("themeIcon");
    const themeColor = document.getElementById("themeColor");

    const typeFilters = document.getElementById("typeFilters");
    const feedbackList = document.getElementById("feedbackList");
    const emptyState = document.getElementById("emptyState");

    let selectedType = "all";
    let sortOrder = "newest";
    let searchOpen = false;
    let sortMenuOpen = false;

    const dateFormatter = new Intl.DateTimeFormat(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });

    /* Theme icons */

    const moonIcon = `
      <path d="M20.9 13A8.5 8.5 0 0 1 11 3.1 8.5 8.5 0 1 0 20.9 13Z"></path>
    `;

    const sunIcon = `
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2"></path>
      <path d="M12 20v2"></path>
      <path d="m4.93 4.93 1.42 1.42"></path>
      <path d="m17.65 17.65 1.42 1.42"></path>
      <path d="M2 12h2"></path>
      <path d="M20 12h2"></path>
      <path d="m4.93 19.07 1.42-1.42"></path>
      <path d="m17.65 6.35 1.42-1.42"></path>
    `;

    function applyTheme(theme) {
      const isDark = theme === "dark";

      document.documentElement.dataset.theme = theme;
      themeIcon.innerHTML = isDark ? sunIcon : moonIcon;

      themeBtn.setAttribute(
        "aria-label",
        isDark ? "Switch to light mode" : "Switch to dark mode"
      );

      themeBtn.setAttribute("aria-pressed", String(isDark));

      themeBtn.title = isDark
        ? "Switch to light mode"
        : "Switch to dark mode";

      themeColor.setAttribute(
        "content",
        isDark ? "#0f172a" : "#2563eb"
      );
    }

    let savedTheme = null;

    try {
      savedTheme = localStorage.getItem("feedback-theme");
    } catch (error) {
      // Storage may be unavailable.
    }

    const initialTheme =
      savedTheme === "dark" || savedTheme === "light"
        ? savedTheme
        : (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
          );

    applyTheme(initialTheme);

    themeBtn.addEventListener("click", () => {
      const currentTheme =
        document.documentElement.dataset.theme || "light";

      const nextTheme =
        currentTheme === "dark" ? "light" : "dark";

      applyTheme(nextTheme);

      try {
        localStorage.setItem("feedback-theme", nextTheme);
      } catch (error) {
        // Theme switching still works for this session.
      }
    });

    /* Render, search, filter and sort feedback */

    function renderFeedbacks() {
      const query = searchInput.value.trim().toLowerCase();

      const filtered = feedbacks
        .filter(item => {
          const matchesType =
            selectedType === "all" || item.type === selectedType;

          const matchesSearch =
            item.message.toLowerCase().includes(query) ||
            item.type.toLowerCase().includes(query);

          return matchesType && matchesSearch;
        })
        .sort((a, b) => {
          const difference =
            new Date(b.date).getTime() - new Date(a.date).getTime();

          return sortOrder === "newest" ? difference : -difference;
        });

      feedbackList.replaceChildren();

      filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "feedback-card";

        const top = document.createElement("div");
        top.className = "card-top";

        const typeLabel = document.createElement("div");
        typeLabel.className = `type-label ${item.type}`;

        const typeIcon = document.createElement("span");
        typeIcon.textContent =
          item.type === "improvement" ? "🛠️" : "⚠️";

        const typeName = document.createElement("span");
        typeName.textContent =
          item.type === "improvement" ? "Improvement" : "Problem";

        typeLabel.append(typeIcon, typeName);

        const date = document.createElement("time");
        date.className = "date";
        date.dateTime = item.date;
        date.textContent =
          dateFormatter.format(new Date(item.date));

        top.append(typeLabel, date);

        const message = document.createElement("p");
        message.className = "message";
        message.textContent = item.message;

        card.append(top, message);
        feedbackList.append(card);
      });

      emptyState.classList.toggle("visible", filtered.length === 0);
    }

    /* Search toggle */

    function setSearchOpen(open) {
      searchOpen = open;

      searchWrap.classList.toggle("open", open);
      searchBtn.classList.toggle("active", open);
      searchBtn.setAttribute("aria-expanded", String(open));

      if (open) {
        // Ensure the input opens directly beside the search button.
        requestAnimationFrame(() => {
          searchInput.focus();
        });
      } else {
        searchInput.value = "";
        renderFeedbacks();
      }
    }

    searchBtn.addEventListener("click", () => {
      setSearchOpen(!searchOpen);
    });

    searchInput.addEventListener("input", renderFeedbacks);

    /* Sort dropdown */

    function positionSortMenu() {
      if (!sortMenuOpen) return;

      // Measure the menu while visible, then keep it inside the viewport.
      const buttonRect = sortBtn.getBoundingClientRect();
      const menuRect = sortMenu.getBoundingClientRect();
      const margin = 12;
      const gap = 8;
      const viewportWidth = document.documentElement.clientWidth;
      const viewportHeight = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

      let left = buttonRect.right - menuRect.width;
      left = Math.max(margin, Math.min(left, viewportWidth - menuRect.width - margin));

      let top = buttonRect.bottom + gap;
      if (top + menuRect.height > viewportHeight - margin) {
        top = buttonRect.top - menuRect.height - gap;
      }
      top = Math.max(margin, Math.min(top, viewportHeight - menuRect.height - margin));

      sortMenu.style.left = `${left}px`;
      sortMenu.style.top = `${top}px`;
    }

    function setSortMenuOpen(open) {
      sortMenuOpen = open;

      sortMenu.classList.toggle("open", open);
      sortBtn.classList.toggle("active", open);
      sortBtn.setAttribute("aria-expanded", String(open));

      if (open) {
        requestAnimationFrame(positionSortMenu);
      } else {
        sortMenu.style.left = "";
        sortMenu.style.top = "";
      }
    }

    window.addEventListener("resize", positionSortMenu);
    window.addEventListener("scroll", positionSortMenu, true);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", positionSortMenu);
      window.visualViewport.addEventListener("scroll", positionSortMenu);
    }

    sortBtn.addEventListener("click", event => {
      event.stopPropagation();
      setSortMenuOpen(!sortMenuOpen);
    });

    /* Select sort order */

    sortOptions.forEach(option => {
      option.addEventListener("click", () => {
        sortOrder = option.dataset.sort;

        sortOptions.forEach(button => {
          const selected = button.dataset.sort === sortOrder;

          button.classList.toggle("selected", selected);
          button.setAttribute("aria-checked", String(selected));
        });

        sortBtn.title =
          sortOrder === "newest"
            ? "Sort: newest first"
            : "Sort: oldest first";

        renderFeedbacks();
        setSortMenuOpen(false);
        sortBtn.focus();
      });
    });

    /* Close the sort menu when clicking outside */

    document.addEventListener("click", event => {
      if (!event.target.closest(".sort-container")) {
        setSortMenuOpen(false);
      }
    });

    /* Escape key closes the open menu or search field */

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;

      if (sortMenuOpen) {
        setSortMenuOpen(false);
        sortBtn.focus();
      } else if (searchOpen) {
        setSearchOpen(false);
        searchBtn.focus();
      }
    });

    /* Feedback type filters */

    typeFilters.addEventListener("click", event => {
      const chip = event.target.closest("[data-type]");
      if (!chip) return;

      selectedType = chip.dataset.type;

      typeFilters.querySelectorAll(".chip").forEach(button => {
        const selected = button === chip;

        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      });

      renderFeedbacks();
    });

    /* Initial render */

    renderFeedbacks();
  </script>
</body>
</html>
