<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb" id="themeColor">
  <title>💰 Costs & Tips</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --green: #16a34a;
      --orange: #d97706;
      --radius: 12px;
      --shadow: 0 8px 24px #0f172a14;
      --focus-ring: #2563eb18;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --primary: #3b82f6;
      --primary-light: #1e3a5f;
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
      --green: #4ade80;
      --orange: #fbbf24;
      --shadow: 0 8px 24px #00000040;
      --focus-ring: #60a5fa30;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s, color .2s;
    }

    button, input { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 52px;
      padding: 8px 12px;
      margin-bottom: 12px;
      background: var(--primary);
      color: white;
      border-radius: 12px;
    }

    .header-toggle {
      display: inline-flex;
      flex: 1 1 auto;
      max-width: 400px;
      justify-content: center;
      gap: 4px;
      padding: 4px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      margin: 0 auto;
    }

    .header-toggle button {
      flex: 1 1 0;
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: white;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
      transition: background .15s, color .15s, border-color .15s;
    }

    .header-toggle button.selected {
      background: white;
      color: var(--primary);
      border-color: rgba(255,255,255,0.25);
    }

    .theme-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px;
      background: rgba(255,255,255,0.12);
      color: white;
    }
    .theme-btn:hover { background: rgba(255,255,255,0.18); }
    .theme-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      margin-bottom: 10px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      transition: background .15s, border-color .15s;
    }

    .icon-btn:hover, .icon-btn.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #searchBtn { order: 1; }

    .search-wrap {
      display: none;
      flex: 1 1 auto;
      min-width: 0;
      order: 2;
    }
    .search-wrap.open { display: block; }

    .search-wrap input {
      display: block;
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 0 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }
    .search-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .sort-container {
      position: relative;
      flex: 0 0 42px;
      width: 42px;
      order: 3;
    }

    .sort-menu {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: 190px;
      max-width: calc(100vw - 24px);
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      display: none;
    }
    .sort-menu.open {
      display: block;
      animation: menuAppear .15s ease-out;
    }

    .sort-menu-label {
      padding: 8px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .sort-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 42px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-size: 14px;
    }
    .sort-option:hover { background: var(--bg); }
    .sort-option.selected {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }
    .sort-option .checkmark { visibility: hidden; font-size: 16px; }
    .sort-option.selected .checkmark { visibility: visible; }

    .toolbar-spacer {
      flex: 1 1 auto;
      min-width: 0;
      order: 4;
    }

    .total-box {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px auto 16px;
      text-align: center;
    }

    .total-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .total-pill .label {
      color: var(--muted);
      font-weight: 700;
    }

    .total-pill strong {
      font-size: 15px;
      font-weight: 800;
    }

    .total-pill.cost strong { color: var(--orange); }
    .total-pill.tip strong { color: var(--green); }

    @keyframes menuAppear {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .entry-list {
      display: grid;
      gap: 10px;
    }

    .entry-card {
      min-width: 0;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px #0f172a05;
      transition: background-color .2s, border-color .2s;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .entry-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 650;
      font-size: 14px;
    }
    .entry-title.cost { color: var(--orange); }
    .entry-title.tip { color: var(--green); }

    .date {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      line-height: 1.5;
      flex-shrink: 0;
    }

    .amount {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .empty-state {
      display: none;
      padding: 36px 16px;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
    .empty-state.visible { display: block; }
    .empty-state .empty-icon { margin-bottom: 8px; font-size: 28px; }
    .empty-state h2 { margin: 0 0 6px; font-size: 16px; }
    .empty-state p { margin: 0; color: var(--muted); font-size: 13px; }

    .source-note { display: none; }

    @media (min-width: 600px) {
      .page { padding: 22px; }
      .entry-card { padding: 16px 18px; }
      .toolbar { gap: 10px; }
    }

    @media (max-width: 360px) {
      .toolbar { gap: 6px; }
      .icon-btn, .sort-container { flex-basis: 38px; width: 38px; }
      .icon-btn { height: 40px; }
      .sort-container .icon-btn { width: 38px; }
      .search-wrap input { height: 40px; padding: 0 8px; }
      .header-toggle button { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="header-toggle" id="typeToggle" role="group" aria-label="Show costs or tips">
        <button type="button" class="selected" data-type="costs" aria-pressed="true">💰 Costs</button>
        <button type="button" data-type="tips" aria-pressed="false">🧧 Tips</button>
      </div>

      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark mode"
        aria-pressed="false" title="Switch to dark mode">
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.9 13A8.5 8.5 0 0 1 11 3.1 8.5 8.5 0 1 0 20.9 13Z"></path>
        </svg>
      </button>
    </header>

    <div class="toolbar" aria-label="Cost and tip controls">
      <button class="icon-btn" id="searchBtn" type="button" aria-label="Search entries"
        aria-expanded="false" aria-controls="searchWrap" title="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
      </button>

      <div class="search-wrap" id="searchWrap">
        <input id="searchInput" type="search" placeholder="Search costs and tips..." aria-label="Search costs and tips">
      </div>

      <div class="sort-container">
        <button class="icon-btn" id="sortBtn" type="button" aria-label="Sort entries"
          aria-expanded="false" aria-haspopup="true" aria-controls="sortMenu" title="Sort entries">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M7 12h10"></path><path d="M10 17h4"></path></svg>
        </button>

        <div class="sort-menu" id="sortMenu" role="menu" aria-label="Sort options">
          <div class="sort-menu-label">Sort by date</div>
          <button class="sort-option selected" type="button" role="menuitemradio" aria-checked="true" data-sort="newest">
            <span>Newest first</span><span class="checkmark" aria-hidden="true">✓</span>
          </button>
          <button class="sort-option" type="button" role="menuitemradio" aria-checked="false" data-sort="oldest">
            <span>Oldest first</span><span class="checkmark" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>

      <div class="toolbar-spacer"></div>
    </div>

    <div class="total-box">
      <div class="total-pill" id="totalPill">
        <span class="label" id="totalLabel">Total 💰 Costs</span>
        <strong id="totalValue">€0.00</strong>
      </div>
    </div>

    <p class="source-note" id="sourceNote"></p>
    <section class="entry-list" id="entryList" aria-label="Costs and tips" aria-live="polite"></section>
    <section class="empty-state" id="emptyState">
      <div class="empty-icon">🔎</div>
      <h2>No entries found</h2>
      <p>Try another search or switch between Costs and Tips.</p>
    </section>
  </main>

  <script>
    const GITHUB_REPO = "mylife-plus/Inventory";
    const costs = [];
    const tips = [
      { id: "tip-1", date: "2026-10-26T22:15:00Z", amount: 2.50, currency: "EUR", message: "Tip" }
    ];

    const searchBtn = document.getElementById("searchBtn");
    const searchWrap = document.getElementById("searchWrap");
    const searchInput = document.getElementById("searchInput");
    const sortBtn = document.getElementById("sortBtn");
    const sortMenu = document.getElementById("sortMenu");
    const sortOptions = document.querySelectorAll(".sort-option");
    const themeBtn = document.getElementById("themeBtn");
    const themeIcon = document.getElementById("themeIcon");
    const themeColor = document.getElementById("themeColor");
    const typeToggle = document.getElementById("typeToggle");
    const entryList = document.getElementById("entryList");
    const emptyState = document.getElementById("emptyState");
    const sourceNote = document.getElementById("sourceNote");
    const totalPill = document.getElementById("totalPill");
    const totalLabel = document.getElementById("totalLabel");
    const totalValue = document.getElementById("totalValue");

    let selectedType = "costs";
    let sortOrder = "newest";
    let searchOpen = false;
    let sortMenuOpen = false;
    let costsError = "";

    const dateFormatter = new Intl.DateTimeFormat(undefined, {
      year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
    });

    const moonIcon = '<path d="M20.9 13A8.5 8.5 0 0 1 11 3.1 8.5 8.5 0 1 0 20.9 13Z"></path>';
    const sunIcon = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.42 1.42"></path><path d="m17.65 17.65 1.42 1.42"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m4.93 19.07 1.42-1.42"></path><path d="m17.65 6.35 1.42-1.42"></path>';

    function parseCostFromTitle(title) {
      if (!title) return { amount: 0, currency: "EUR" };

      const match = title.match(/💰\s*([0-9]+(?:[.,][0-9]+)?)\s*([$€£])/i);
      if (!match) return { amount: 0, currency: "EUR" };

      const amount = Number(match[1].replace(",", "."));
      const symbol = match[2];
      const symbolMap = {
        "$": "USD",
        "€": "EUR",
        "£": "GBP"
      };

      return {
        amount: Number.isFinite(amount) ? amount : 0,
        currency: symbolMap[symbol] || "EUR"
      };
    }

    function formatMoney(amount, currency) {
      try {
        return new Intl.NumberFormat(undefined, {
          style: "currency",
          currency: (currency || "EUR").toUpperCase()
        }).format(Number(amount || 0));
      } catch (error) {
        return `${Number(amount || 0).toFixed(2)} ${(currency || "EUR").toUpperCase()}`;
      }
    }

    function formatDate(date) {
      const parsed = new Date(date);
      return Number.isNaN(parsed.getTime()) ? "Date unavailable" : dateFormatter.format(parsed);
    }

    function sumAmounts(items) {
      return items.reduce((sum, item) => {
        const value = Number(item.amount || 0);
        return sum + (Number.isFinite(value) ? value : 0);
      }, 0);
    }

    function updateTotal() {
      const total = selectedType === "costs"
        ? sumAmounts(costs)
        : sumAmounts(tips);

      const label = selectedType === "costs" ? "Total 💰 Costs" : "Total 🧧 Tips";
      totalLabel.textContent = label;
      totalValue.textContent = formatMoney(total, "EUR");

      totalPill.classList.toggle("cost", selectedType === "costs");
      totalPill.classList.toggle("tip", selectedType === "tips");
      totalPill.classList.remove("cost", "tip");
      if (selectedType === "costs") totalPill.classList.add("cost");
      if (selectedType === "tips") totalPill.classList.add("tip");
    }

    function getVisibleEntries() {
      const query = searchInput.value.trim().toLowerCase();
      const entries = selectedType === "costs" ? costs : tips;

      return entries.filter(item => {
        const searchable = `${item.title || ""} ${item.message || ""} ${item.amount ?? ""} ${item.currency || ""} ${item.url || ""}`.toLowerCase();
        return searchable.includes(query);
      }).sort((a, b) => {
        const diff = new Date(b.date).getTime() - new Date(a.date).getTime();
        return sortOrder === "newest" ? diff : -diff;
      });
    }

    function renderEntries() {
      entryList.replaceChildren();
      const entries = getVisibleEntries();

      if (selectedType === "costs" && costsError && costs.length === 0) {
        const card = document.createElement("article");
        card.className = "entry-card";

        const title = document.createElement("div");
        title.className = "entry-title cost";
        title.textContent = "⚠️ Could not load GitHub issues";

        const message = document.createElement("p");
        message.className = "message";
        message.textContent = costsError + " You can still use the Tips tab, or add cost entries to the costs array in this HTML file.";

        card.append(title, message);
        entryList.append(card);
        emptyState.classList.remove("visible");
        return;
      }

      entries.forEach(item => {
        const card = document.createElement("article");
        card.className = "entry-card";

        const top = document.createElement("div");
        top.className = "card-top";

        const title = document.createElement("div");
        title.className = `entry-title ${selectedType === "costs" ? "cost" : "tip"}`;
        title.textContent = selectedType === "costs" ? "💰 Cost" : "🧧 Tip";

        const date = document.createElement("time");
        date.className = "date";
        date.dateTime = item.date || "";
        date.textContent = formatDate(item.date);

        top.append(title, date);
        card.append(top);

        if (selectedType === "tips") {
          const amount = document.createElement("p");
          amount.className = "amount";
          amount.textContent = formatMoney(item.amount, item.currency);
          card.append(amount);
        } else {
          const heading = document.createElement("p");
          heading.className = "message";
          heading.textContent = item.title || "Closed issue";
          card.append(heading);

          if (item.amount && item.amount > 0) {
            const amount = document.createElement("p");
            amount.className = "amount";
            amount.textContent = formatMoney(item.amount, item.currency);
            card.append(amount);
          }

          if (item.url) {
            const link = document.createElement("a");
            link.className = "entry-link";
            link.href = item.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "View GitHub issue";
            card.append(link);
          }
        }

        entryList.append(card);
      });

      emptyState.classList.toggle("visible", entries.length === 0);
    }

    function setSearchOpen(open) {
      searchOpen = open;
      searchWrap.classList.toggle("open", open);
      searchBtn.classList.toggle("active", open);
      searchBtn.setAttribute("aria-expanded", String(open));

      if (open) requestAnimationFrame(() => searchInput.focus());
      else {
        searchInput.value = "";
        renderEntries();
      }
    }

    searchBtn.addEventListener("click", () => setSearchOpen(!searchOpen));
    searchInput.addEventListener("input", renderEntries);

    function positionSortMenu() {
      if (!sortMenuOpen) return;

      const buttonRect = sortBtn.getBoundingClientRect();
      const menuRect = sortMenu.getBoundingClientRect();
      const margin = 12, gap = 8;
      const viewportWidth = document.documentElement.clientWidth;
      const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

      let left = buttonRect.right - menuRect.width;
      left = Math.max(margin, Math.min(left, viewportWidth - menuRect.width - margin));

      let top = buttonRect.bottom + gap;
      if (top + menuRect.height > viewportHeight - margin) top = buttonRect.top - menuRect.height - gap;
      top = Math.max(margin, Math.min(top, viewportHeight - menuRect.height - margin));

      sortMenu.style.left = `${left}px`;
      sortMenu.style.top = `${top}px`;
    }

    function setSortMenuOpen(open) {
      sortMenuOpen = open;
      sortMenu.classList.toggle("open", open);
      sortBtn.classList.toggle("active", open);
      sortBtn.setAttribute("aria-expanded", String(open));

      if (open) requestAnimationFrame(positionSortMenu);
      else {
        sortMenu.style.left = "";
        sortMenu.style.top = "";
      }
    }

    sortBtn.addEventListener("click", event => {
      event.stopPropagation();
      setSortMenuOpen(!sortMenuOpen);
    });

    window.addEventListener("resize", positionSortMenu);
    window.addEventListener("scroll", positionSortMenu, true);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", positionSortMenu);
      window.visualViewport.addEventListener("scroll", positionSortMenu);
    }

    sortOptions.forEach(option => option.addEventListener("click", () => {
      sortOrder = option.dataset.sort;
      sortOptions.forEach(button => {
        const selected = button.dataset.sort === sortOrder;
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-checked", String(selected));
      });
      sortBtn.title = sortOrder === "newest" ? "Sort: newest first" : "Sort: oldest first";
      renderEntries();
      setSortMenuOpen(false);
      sortBtn.focus();
    }));

    document.addEventListener("click", event => {
      if (!event.target.closest(".sort-container")) setSortMenuOpen(false);
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;

      if (sortMenuOpen) {
        setSortMenuOpen(false);
        sortBtn.focus();
      } else if (searchOpen) {
        setSearchOpen(false);
        searchBtn.focus();
      }
    });

    typeToggle.addEventListener("click", event => {
      const button = event.target.closest("[data-type]");
      if (!button) return;

      selectedType = button.dataset.type;

      typeToggle.querySelectorAll("button").forEach(item => {
        const selected = item === button;
        item.classList.toggle("selected", selected);
        item.setAttribute("aria-pressed", String(selected));
      });

      updateTotal();
      renderEntries();
    });

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.dataset.theme = theme;
      themeIcon.innerHTML = isDark ? sunIcon : moonIcon;
      themeBtn.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
      themeBtn.setAttribute("aria-pressed", String(isDark));
      themeBtn.title = isDark ? "Switch to light mode" : "Switch to dark mode";
      themeColor.setAttribute("content", isDark ? "#0f172a" : "#2563eb");
    }

    let savedTheme = null;
    try { savedTheme = localStorage.getItem("costs-tips-theme"); } catch (error) {}
    const initialTheme = savedTheme === "dark" || savedTheme === "light"
      ? savedTheme
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    applyTheme(initialTheme);

    themeBtn.addEventListener("click", () => {
      const nextTheme = (document.documentElement.dataset.theme || "light") === "dark" ? "light" : "dark";
      applyTheme(nextTheme);
      try { localStorage.setItem("costs-tips-theme", nextTheme); } catch (error) {}
    });

    async function loadCostsFromGitHub() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/issues?state=closed&per_page=100`);

        if (!response.ok) {
          throw new Error(response.status === 403 ? "GitHub API rate limit reached." : `GitHub returned HTTP ${response.status}.`);
        }

        const issues = await response.json();

        issues.filter(issue => !issue.pull_request).forEach(issue => {
          const parsed = parseCostFromTitle(issue.title);

          costs.push({
            id: issue.id,
            date: issue.closed_at || issue.updated_at || issue.created_at,
            title: issue.title,
            url: issue.html_url,
            amount: parsed.amount,
            currency: parsed.currency
          });
        });

        costsError = "";
      } catch (error) {
        costsError = "The closed issues could not be fetched from GitHub in this browser.";
      }

      updateTotal();
      renderEntries();
    }

    updateTotal();
    renderEntries();
    loadCostsFromGitHub();
  </script>
</body>
</html>
